spring:
  application:
    name: connexa-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Connexa API
    version: ${CONNEXA_APP_VERSION:0.1.0-SNAPSHOT}

connexa:
  service-name: connexa-api
  environment: ${CONNEXA_ENVIRONMENT:local}
  identity:
    mode: ${CONNEXA_IDENTITY_MODE:rejecting}
  assistant:
    mode: ${CONNEXA_ASSISTANT_MODE:disabled}
  persistence:
    mode: ${CONNEXA_PERSISTENCE_MODE:in-memory}
  integrations:
    firebase-enabled: false
    ai-enabled: false
    mail-enabled: false
    notifications-enabled: false
