name: Foundation quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the foundation
        run: python scripts/verify_foundation.py

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: repository-checks
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run API tests
        working-directory: services/connexa-api
        run: bash ./gradlew test

  android-unit-tests:
    name: Android unit tests and lint
    runs-on: ubuntu-latest
    needs: repository-checks
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Run Android unit tests and lint
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug
